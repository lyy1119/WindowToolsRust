[package]
name = "window-tools-rust"
version = "0.1.0"
edition = "2021"
description = "WindowToolsRust - a windowTop-like utility for Windows, written in Rust"
license = "MIT"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "0.26"
global-hotkey = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
